name: Build AZ-Kompass APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android-Projekt zusammensetzen
        shell: bash
        run: |
          set -e

          mkdir -p buildapp/app/src/main/java/de/azkompass/app
          mkdir -p buildapp/app/src/main/assets
          mkdir -p buildapp/app/src/main/res/drawable
          mkdir -p buildapp/app/src/main/res/values

          cp settings.gradle buildapp/settings.gradle
          cp gradle.properties buildapp/gradle.properties

          cat > buildapp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cp build.gradle buildapp/app/build.gradle
          cp AndroidManifest.xml buildapp/app/src/main/AndroidManifest.xml
          cp MainActivity.java buildapp/app/src/main/java/de/azkompass/app/MainActivity.java
          cp index.html buildapp/app/src/main/assets/index.html
          cp ic_launcher.xml buildapp/app/src/main/res/drawable/ic_launcher.xml
          cp styles.xml buildapp/app/src/main/res/values/styles.xml

      - name: Build debug APK
        run: gradle -p buildapp :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AZ-Kompass-debug-apk
          path: buildapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
